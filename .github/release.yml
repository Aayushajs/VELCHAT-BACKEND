changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - github-actions[bot]
  categories:
    - title: 'Breaking Changes'
      labels:
        - breaking-change
        - breaking
    - title: 'New Features'
      labels:
        - enhancement
        - feature
        - feat
    - title: 'Bug Fixes'
      labels:
        - bug
        - fix
        - bugfix
    - title: 'Performance'
      labels:
        - performance
        - perf
    - title: 'Security'
      labels:
        - security
    - title: 'Maintenance'
      labels:
        - refactor
        - chore
        - cleanup
        - maintenance
    - title: 'Documentation'
      labels:
        - documentation
        - docs
    - title: 'Dependencies'
      labels:
        - dependencies
        - deps
    - title: 'Infrastructure'
      labels:
        - infrastructure
        - ci
        - devops
    - title: 'Other Changes'
      labels:
        - '*'
