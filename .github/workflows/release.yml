name: release

# Automated versioning for the monorepo via Changesets — versions ONLY the packages that changed.
# On push to main: if unreleased changesets exist, opens a "Version Packages" PR; when that PR
# merges, creates git tags + GitHub Releases. No npm publish (packages are private). ci.yml is
# untouched; this workflow only handles versioning/releases.

on:
  push:
    branches: [main]

# changesets/action needs to open the version PR + create tags/releases.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so Changesets computes bumps correctly
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create Version PR / tag + release
        if: ${{ secrets.CHANGESETS_GITHUB_TOKEN != '' }}
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          # Private monorepo → no npm publish; tag packages so the action cuts GitHub Releases.
          publish: pnpm changeset:tag
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          # This repository disallows PR creation with the default workflow token.
          # Use a PAT in `CHANGESETS_GITHUB_TOKEN` (repo scope) for the Changesets action.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}
      - name: Skip Changesets (missing PAT)
        if: ${{ secrets.CHANGESETS_GITHUB_TOKEN == '' }}
        run: |
          echo "::notice::Skipping changesets release: CHANGESETS_GITHUB_TOKEN is not set, and secrets.GITHUB_TOKEN cannot create PRs in this repository."
