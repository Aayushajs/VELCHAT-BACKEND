name: release

# Merge to main → version → images → tag + GitHub Release → deploy.
#
# The version is derived from Conventional Commits, so a merge produces a release with no second
# PR to approve. (This replaced a Changesets flow, which needed a "Version Packages" PR merged
# before any tag appeared — correct for publishing many npm packages, but this repo publishes
# container images from one repo-wide version, so the extra round trip bought nothing.)
#
# Ordering is deliberate: images are built and pushed BEFORE the tag exists. A build that fails
# therefore leaves no tag and no release, so a tag in this repo always denotes something that
# actually built.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Image platforms (default amd64 only — see the note in the images job)'
        required: false
        default: 'linux/amd64'

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false # never cancel a half-published release

env:
  # GHCR namespaces by repository OWNER, and the path must be lowercase.
  REGISTRY: ghcr.io

jobs:
  version:
    name: next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      bump: ${{ steps.semver.outputs.bump }}
      owner: ${{ steps.owner.outputs.lc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, or the commit range below is wrong

      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: semver
        name: Derive the next version from Conventional Commits
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          LAST=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$LAST" ]; then
            # No tag yet: seed from the root package.json so the first release cannot land BEHIND
            # the version the repo already advertises.
            BASE=$(node -p "require('./package.json').version")
            RANGE=""
            echo "No existing tag; seeding from package.json ($BASE)"
          else
            BASE="${LAST#v}"
            RANGE="${LAST}..HEAD"
            echo "Last tag $LAST; scanning $RANGE"
          fi

          SUBJECTS=$(git log --no-merges --format='%s' ${RANGE} || true)
          BODIES=$(git log --no-merges --format='%B' ${RANGE} || true)

          BUMP=none
          if printf '%s\n' "$BODIES" | grep -qE '^BREAKING[ -]CHANGE:'; then
            BUMP=major
          elif printf '%s\n' "$SUBJECTS" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
            BUMP=major
          elif printf '%s\n' "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP=minor
          elif printf '%s\n' "$SUBJECTS" | grep -qE '^(fix|perf|revert)(\([^)]*\))?:'; then
            BUMP=patch
          fi

          MAJOR="${BASE%%.*}"; REST="${BASE#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          PATCH="${PATCH%%-*}"

          # Pre-1.0 guard: while the major is 0 the API is not declared stable, so a breaking
          # change bumps the MINOR (0.4.1 -> 0.5.0). Without this a stray "feat!:" would declare
          # 1.0.0 by accident, which is not a decision a commit message should be able to make.
          if [ "$BUMP" = "major" ] && [ "$MAJOR" -eq 0 ]; then
            echo "::notice::pre-1.0: breaking change treated as a minor bump. Tag v1.0.0 by hand when ready."
            BUMP=minor
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            none)  echo "::notice::No feat/fix/breaking commits since ${LAST:-repo start} — nothing to release." ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          {
            echo "bump=$BUMP"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "### Release: $BUMP -> v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: image ${{ matrix.service }}
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (OIDC)
      attestations: write
    strategy:
      fail-fast: false # one bad service should not hide the state of the other six
      matrix:
        service:
          - edge-gateway
          - identity-service
          - messaging-service
          - realtime-service
          - content-service
          - platform-service
          - velchat-mono
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          # amd64 only by default. arm64 has to run under QEMU here, which roughly triples build
          # time for a full pnpm monorepo across seven images — real Actions minutes for an
          # architecture the current deploy target (Azure B1S) does not use. Re-run this workflow
          # from the Actions tab with platforms=linux/amd64,linux/arm64 when publishing for
          # Oracle A1 / AWS Graviton / Azure B2pts.
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/velchat-${{ matrix.service }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/velchat-${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/velchat-${{ matrix.service }}:latest
          # BuildKit emits both and attaches them to the image in the registry, so provenance and
          # the dependency list travel WITH the artifact instead of living in a CI log.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        # Signs the DIGEST, not a tag: a tag can be repointed at different bytes later, a digest
        # cannot, so the signature stays bound to exactly what was scanned here.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/velchat-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/velchat-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Trivy scan the built image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/velchat-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  publish:
    name: tag + GitHub Release
    needs: [version, images]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the tag
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
        env:
          TAG: ${{ needs.version.outputs.tag }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          body: |
            Container images for `${{ needs.version.outputs.version }}` — signed with cosign, each carrying an SBOM and build provenance.

            Pull:

            ```
            ghcr.io/${{ needs.version.outputs.owner }}/velchat-velchat-mono:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/velchat-edge-gateway:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/velchat-identity-service:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/velchat-messaging-service:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/velchat-realtime-service:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/velchat-content-service:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/velchat-platform-service:${{ needs.version.outputs.version }}
            ```

            Verify a signature before trusting an image:

            ```bash
            cosign verify ghcr.io/${{ needs.version.outputs.owner }}/velchat-velchat-mono:${{ needs.version.outputs.version }} \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

  deploy:
    name: deploy to Azure
    needs: [version, images, publish]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    # Gives the deploy its own secret scope, and is the hook for manual approval: add a required
    # reviewer to this environment in Settings -> Environments and every deploy waits for a human.
    # Left ungated by default so a merge reaches the VM on its own. The url makes the repo's
    # Deployments sidebar link straight at the running box.
    environment:
      name: production
      # vars, not secrets: GitHub does not allow the secrets context in environment.url, and an
      # invalid workflow file fails on every branch, not just this one. The URL is a public
      # endpoint anyway.
      url: ${{ vars.AZURE_PUBLIC_URL }}
    env:
      # `if:` cannot read the secrets context directly, so the presence check is lifted to env.
      # Without the credential the deploy still runs; it just cannot start a stopped VM.
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v4

      # The box is deallocated outside working hours to conserve credit, so a deploy that assumes
      # it is running fails on SSH timeout — which is exactly what happened on the v8.1.0 release.
      # Start it first. `az vm start` on an already-running VM is a no-op, so this is safe to run
      # every time. The service principal is scoped to the velchat resource group only.
      - name: Start the VM if it is deallocated
        if: ${{ env.HAS_AZURE_CREDS == 'true' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure the VM is running
        id: vm
        if: ${{ env.HAS_AZURE_CREDS == 'true' }}
        run: |
          set -euo pipefail
          state=$(az vm get-instance-view -g velchat -n velchat-vm             --query "instanceView.statuses[1].displayStatus" -o tsv)
          echo "power state: $state"

          if [ "$state" = "VM running" ]; then
            # Already on — someone is working on it. Leave it on when we are done.
            echo "started_by_ci=false" >> "$GITHUB_OUTPUT"
            echo "The VM was already running; it will be left running."
            exit 0
          fi

          # Recorded BEFORE the start call, so the deallocate step still knows to run even if
          # something below fails. Leaving a VM running by accident is the expensive mistake here.
          echo "started_by_ci=true" >> "$GITHUB_OUTPUT"
          echo "The VM was deallocated; starting it and it will be deallocated again afterwards."
          az vm start -g velchat -n velchat-vm -o none

          # 'VM running' arrives before sshd is listening, so wait on the port, not the status.
          for i in $(seq 1 36); do
            if nc -z -w 5 "$HOST" "${PORT:-22}" 2>/dev/null; then
              echo "ssh reachable after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::VM started but port ${PORT:-22} never opened"
          exit 1
        env:
          HOST: ${{ secrets.AZURE_HOST }}
          PORT: ${{ secrets.AZURE_SSH_PORT }}

      - name: Deploy over SSH
        # Written out rather than delegated to a marketplace action: this step holds the key to the
        # production host, and the repo already prefers auditable, pinned supply chains.
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "${SSH_HOST_KEY:-}" ]; then
            printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::AZURE_SSH_HOST_KEY is not set — trusting the host on first sight. Set it to pin the host and defeat MITM."
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          # Ship only the compose file and the edge config. The .env stays on the VM and never
          # enters CI, so database URLs and the internal secret are never exposed to a workflow run.
          #
          # The repo's directory layout is mirrored on the box because compose.yml mounts
          # ../shared/Caddyfile — a path relative to its own directory. Flattening both into the
          # home directory makes that resolve to /home/shared, and Caddy refuses to start.
          ssh -p "${PORT:-22}" "$SSH_USER@$HOST" 'mkdir -p ~/velchat-deploy/azure ~/velchat-deploy/shared'
          scp -P "${PORT:-22}" deploy/azure/compose.yml "$SSH_USER@$HOST:~/velchat-deploy/azure/compose.yml"
          scp -P "${PORT:-22}" deploy/shared/Caddyfile "$SSH_USER@$HOST:~/velchat-deploy/shared/Caddyfile"

          ssh -p "${PORT:-22}" "$SSH_USER@$HOST" \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' TAG='$VERSION' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # compose.yml also declares env_file: [./.env], resolved next to itself.
          ln -sf ~/velchat.env ~/velchat-deploy/azure/.env
          export TAG
          docker compose -f ~/velchat-deploy/azure/compose.yml --env-file ~/velchat.env pull
          docker compose -f ~/velchat-deploy/azure/compose.yml --env-file ~/velchat.env up -d --remove-orphans
          docker image prune -f   # a 1 GB box fills up fast otherwise
          docker logout ghcr.io
          REMOTE
        env:
          SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.AZURE_SSH_HOST_KEY }}
          HOST: ${{ secrets.AZURE_HOST }}
          SSH_USER: ${{ secrets.AZURE_USER }}
          PORT: ${{ secrets.AZURE_SSH_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}

      - name: Smoke check
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "${URL}/health" > /dev/null; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${URL}/health did not come up. The previous containers may still be serving — check the VM."
          exit 1
        env:
          URL: ${{ vars.AZURE_PUBLIC_URL }}

      # LAST, and always(): if this job started the VM it must put it back, whether the deploy
      # succeeded, failed, or the run was cancelled. Leaving a B2as_v2 running unnoticed burns
      # roughly $1.20 a day out of a fixed credit, so the failure mode to design against is not
      # "stop did not happen" but "stop was skipped because something else broke".
      #
      # It deliberately does NOT run when the VM was already on — someone is working on it, and a
      # deploy is not a reason to pull the box out from under them.
      - name: Deallocate the VM if this job started it
        if: ${{ always() && env.HAS_AZURE_CREDS == 'true' && steps.vm.outputs.started_by_ci == 'true' }}
        run: |
          set -uo pipefail
          echo "This job started the VM; deallocating it again."
          for attempt in 1 2 3; do
            if az vm deallocate -g velchat -n velchat-vm -o none; then
              echo "deallocated"
              break
            fi
            echo "deallocate attempt $attempt failed; retrying in 15s"
            sleep 15
          done

          # Verify rather than trust: a silent failure here is a bill, so confirm the final state
          # and fail loudly if the box is still running.
          state=$(az vm get-instance-view -g velchat -n velchat-vm             --query "instanceView.statuses[1].displayStatus" -o tsv 2>/dev/null || echo unknown)
          echo "final power state: $state"
          if [ "$state" != "VM deallocated" ]; then
            echo "::error::VM is still '$state' after deallocate. Stop it by hand: pnpm vm stop"
            exit 1
          fi

  # ---------------------------------------------------------------------------------------------
  tidy-stale-environments:
    name: remove dead 13-service environments
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # Deleting an environment needs repository administration, not just contents.
      administration: write
    steps:
      - name: Delete the Render environments left over from the 13-service topology
        # STOPGAP, not a fix. Render is still connected to the pre-consolidation blueprint on
        # `main`, so on every push it deploys thirteen services that no longer exist and creates a
        # `main - velchat-<service>` environment for each. They then crowd the repo's Deployments
        # sidebar, where `main` should show production (Azure) and nothing else.
        #
        # This removes only those thirteen exact names, so it cannot touch `production`,
        # `development`, or anything Render creates once it correctly tracks `dev`. It becomes a
        # no-op the moment the blueprint is recreated — see docs/RUNBOOK.md section 6, which is the
        # actual fix. Until then Render also keeps burning build minutes on a dead topology, which
        # this does nothing about.
        continue-on-error: true
        run: |
          set -uo pipefail
          dead="ai-service api-gateway auth-service automation-service call-service chat-service \
                group-channel-service media-service notification-service presence-service \
                realtime-gateway search-service user-service"
          removed=0
          for svc in $dead; do
            name="main - velchat-$svc"
            enc=$(jq -rn --arg n "$name" '$n|@uri')
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/environments/${enc}" >/dev/null 2>&1; then
              echo "removed: $name"
              removed=$((removed + 1))
            fi
          done
          echo "removed $removed stale environment(s)"
          if [ "$removed" -gt 0 ]; then
            echo "::warning::Render is still deploying the old 13-service blueprint from main. Recreate the blueprint on dev — docs/RUNBOOK.md section 6."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
