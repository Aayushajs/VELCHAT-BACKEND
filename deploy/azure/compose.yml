# VelChat on an Azure VM. Runs ONE process (`velchat-mono`) with every feature group mounted, plus
# Valkey locally because it is tiny and the event bus must not be metered. Postgres and Mongo are
# external — see .env.example.
#
# Sizing is env-driven so one file serves both boxes people actually use here:
#
#   B1S      1 vCPU / 1 GB, free allowance   → MONO_MEM=480M  MONO_HEAP=320  VALKEY_MEM=160M
#   B2as_v2  2 vCPU / 8 GB, from credit      → the defaults below
#
# The mono profile is not a lesser build: it mounts the same FeatureGroup values the six services
# mount, through the same assembler, so only the process count differs. On an 8 GB box you could
# also run SPLIT_PROFILE=axis6 for parity with Render — see deploy/PORTABILITY.md.
#
# It is the same code as the six-service topology, mounted through the same assembler; only the
# process count differs. Moving to six later is a profile change, not a rewrite.
#
# Bring up:  docker compose -f deploy/azure/compose.yml --env-file deploy/azure/.env up -d
name: velchat

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ['80:80', '443:443']
    volumes:
      - ../shared/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      # The shared Caddyfile routes by these, so one file serves every target: in mono both the
      # API and the WebSocket upgrade land on the same process.
      UPSTREAM_API: velchat-mono:3000
      UPSTREAM_WS: velchat-mono:3000
    depends_on: [velchat-mono]
    deploy: { resources: { limits: { memory: '${CADDY_MEM:-128M}' } } }

  velchat-mono:
    image: '${IMAGE_REPO:-ghcr.io/velcart}/velchat-velchat-mono:${TAG:-latest}'
    restart: always
    env_file: [./.env]
    environment:
      SERVICE_NAME: velchat-mono
      HTTP_PORT: 3000
      # Node will not grow the heap past this no matter what the container limit says, so the two
      # move together: keep the heap comfortably under MONO_MEM, which also has to cover the
      # non-heap side (buffers, native modules, ffmpeg). Check `docker stats` before raising it.
      NODE_OPTIONS: '--max-old-space-size=${MONO_HEAP:-2048}'
    depends_on:
      valkey: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    deploy:
      resources:
        limits: { memory: '${MONO_MEM:-3G}' }
        reservations: { cpus: '${MONO_CPUS:-1.0}' }

  # Local, not managed: Azure Cache for Redis has no free tier, and a metered Redis is the worst
  # possible home for the event bus (Redis Streams consumers poll continuously). Valkey is ~60 MB.
  # `noeviction` is load-bearing — evicting a `seq:*` key reissues sequence numbers, which the
  # mobile client skips as already-held: message loss with no error.
  valkey:
    image: valkey/valkey:8-alpine
    restart: always
    command:
      - valkey-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - '${VALKEY_MAXMEMORY:-768mb}'
      - --maxmemory-policy
      - noeviction
    volumes: [valkeydata:/data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: '${VALKEY_MEM:-1G}' }
        reservations: { cpus: '${VALKEY_CPUS:-0.25}' }

volumes:
  valkeydata:
  caddydata:
  caddyconfig:
