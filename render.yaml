# Render Blueprint — VelChat backend on the FREE tier (₹0 MVP).
# Docs: https://render.com/docs/blueprint-spec   ·   Deploy guide: deploy/RENDER.md
#
# Managed free datastores (set the secrets in the dashboard, never in git):
#   Postgres → Neon · Mongo → Atlas · Redis + Streams → Upstash · Media → Cloudinary
#   Traces/metrics → Grafana Cloud (OTLP)
#
# Each service builds from its own Dockerfile with the repo root as context and listens on the
# port Render injects (config maps PORT → HTTP_PORT). Render free web services sleep when idle.
#
# This blueprint deploys the BUILT CORE (auth, chat, realtime, group-channel, user, presence) plus
# api-gateway. The remaining scaffolded services (notification, media, search, call, automation, ai)
# are listed-but-commented at the bottom — uncomment them as each phase lands / you upgrade the plan.

envVarGroups:
  - name: velchat-shared
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: LOG_LEVEL, value: info }
      # Free-tier provider selection (port + adapter)
      - { key: EVENT_BUS, value: redis-streams }
      - { key: STORAGE_PROVIDER, value: cloudinary }
      - { key: SEARCH_PROVIDER, value: atlas }
      # Secrets — set in the Render dashboard (sync:false keeps them out of git)
      - { key: POSTGRES_URL, sync: false } # Neon (sslmode=require)
      - { key: MONGO_URL, sync: false } # MongoDB Atlas SRV
      - { key: VALKEY_URL, sync: false } # Upstash (rediss://…) — cache + event bus
      - { key: CLOUDINARY_URL, sync: false } # cloudinary://key:secret@cloud
      - { key: OTEL_EXPORTER_OTLP_ENDPOINT, sync: false } # https://otlp-gateway-<region>.grafana.net/otlp
      - { key: OTEL_EXPORTER_OTLP_HEADERS, sync: false } # Authorization=Basic <base64 id:token>
      # ── Feature integrations (all OPTIONAL — unset ⇒ safe dev fallback; verify with scripts/) ──
      # Mail (auth magic-link/welcome + notification digests). Brevo/Postfix: smtp://user:pass@host:587
      - { key: SMTP_URL, sync: false } # URL-encode @/: in user+pass (@ → %40)
      - { key: MAIL_FROM, sync: false } # a VERIFIED sender (else the relay blocks it)
      - { key: MAIL_LOGO_URL, sync: false } # public logo URL for emails (optional)
      - { key: MAIL_WEBSITE_URL, value: https://velcart.netlify.app/ } # footer website icon
      - { key: MAIL_LINKEDIN_URL, value: https://www.linkedin.com/company/velcart/ } # footer LinkedIn
      - { key: MAIL_SUPPORT_TEXT, value: support@velcart.com } # footer support text → website
      # Reverse-OTP (₹0 verification, §B2.2) — Asterisk/FreeSWITCH webhook
      - { key: REVOTP_WEBHOOK_SECRET, sync: false }
      - { key: REVOTP_DID, sync: false } # owned inbound number users missed-call / SMS
      # 2Factor.in SMS OTP (§B2) — the PRIMARY phone verification for the mobile app.
      # Without these the auth-service stays in fail-closed dev-mode and returns 403
      # ("only the configured dev phone may receive an OTP") for every number.
      - { key: OTP_API_KEY, sync: false } # 2Factor.in API key
      - { key: OTP_TEMPLATE, sync: false } # DLT-approved template name (default: Temp1)
      # SAFETY fuse (code default = "true"): while true, ONLY OTP_DEV_PHONE receives an OTP.
      # Dashboard-controlled (sync:false) so the blueprint never OVERWRITES your choice on a
      # redeploy — set "false" to let any number verify (prod), or keep true + set OTP_DEV_PHONE.
      - { key: OTP_DEV_MODE, sync: false }
      - { key: OTP_DEV_PHONE, sync: false } # the one E.164 number allowed while dev-mode is on
      # Web Push (VAPID) — npx web-push generate-vapid-keys
      - { key: VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false } # mailto:ops@yourdomain or a URL
      # Mobile Push (FCM HTTP v1) — from the service-account JSON (keep \n escapes in the key)
      - { key: FCM_PROJECT_ID, sync: false }
      - { key: FCM_CLIENT_EMAIL, sync: false }
      - { key: FCM_PRIVATE_KEY, sync: false }
      # Calls (LiveKit SFU) — from your LiveKit server/cloud
      - { key: LIVEKIT_URL, sync: false } # wss://…
      - { key: LIVEKIT_API_KEY, sync: false }
      - { key: LIVEKIT_API_SECRET, sync: false }

services:
  - type: web
    name: velchat-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./docker/api-gateway.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api-gateway/**
        - libs/**
        - docker/api-gateway.Dockerfile
        - package.json
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - { fromGroup: velchat-shared }
      - { key: SERVICE_NAME, value: api-gateway }
      # Route each path prefix to its DEPLOYED service. Without these the gateway
      # proxies to localhost and returns 502 "Upstream service unavailable".
      - { key: UPSTREAM_AUTH, value: https://velchat-auth-service.onrender.com }
      - { key: UPSTREAM_USER, value: https://velchat-user-service.onrender.com }
      - { key: UPSTREAM_CHAT, value: https://velchat-chat-service.onrender.com }
      - { key: UPSTREAM_GROUP_CHANNEL, value: https://velchat-group-channel-service.onrender.com }
      - { key: UPSTREAM_PRESENCE, value: https://velchat-presence-service.onrender.com }
      - { key: UPSTREAM_MEDIA, value: https://velchat-media-service.onrender.com }
      - { key: UPSTREAM_NOTIFICATION, value: https://velchat-notification-service.onrender.com }
      - { key: UPSTREAM_SEARCH, value: https://velchat-search-service.onrender.com }
      - { key: UPSTREAM_CALL, value: https://velchat-call-service.onrender.com }
      - { key: UPSTREAM_AUTOMATION, value: https://velchat-automation-service.onrender.com }
      - { key: UPSTREAM_AI, value: https://velchat-ai-service.onrender.com }

