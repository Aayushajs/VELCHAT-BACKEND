# VelChat backend on Render (FREE tier) — the SIX-service topology.
# Docs: https://render.com/docs/blueprint-spec   ·   deploy/RENDER.md
#
# Render is kept as a fallback target, not the primary one. Its free web services sleep when idle,
# so a cold start is user-visible; the primary deployment is a single always-on Oracle Always Free
# VM (docker/compose.oracle.yml + deploy/ORACLE.md). Portability across Oracle / AWS / Azure /
# Render is described in deploy/PORTABILITY.md — the image and env contract are identical
# everywhere, only the orchestrator changes.
#
# Managed free datastores for this profile (set the secrets in the dashboard, never in git):
#   Postgres → Neon · Mongo → Atlas · Redis + Streams → Upstash · Media → Cloudinary
# NOTE: these free tiers are metered and WILL throttle a busy chat backend — Upstash allows
# 500k commands/month and the event bus alone consumes that quickly. See deploy/PORTABILITY.md.

envVarGroups:
  - name: velchat-shared
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: LOG_LEVEL, value: info }
      # Free-tier provider selection (port + adapter)
      - { key: EVENT_BUS, value: redis-streams }
      - { key: STORAGE_PROVIDER, value: cloudinary }
      - { key: SEARCH_PROVIDER, value: atlas }
      # Auth (DEF-02/DEF-13) — REQUIRED. Every service verifies access tokens itself, so each one
      # needs JWT_PUBLIC_PEM or it refuses to boot. JWT_PRIVATE_PEM is auth-service's signing key.
      # Unset ⇒ auth-service mints an ephemeral keypair per boot and every restart logs everyone out.
      # Generate: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt.key
      #           openssl rsa -in jwt.key -pubout -out jwt.pub
      - { key: JWT_PRIVATE_PEM, sync: false }
      - { key: JWT_PUBLIC_PEM, sync: false }
      # Secrets — set in the Render dashboard (sync:false keeps them out of git)
      - { key: POSTGRES_URL, sync: false } # Neon (sslmode=require)
      - { key: MONGO_URL, sync: false } # MongoDB Atlas SRV
      - { key: VALKEY_URL, sync: false } # Upstash (rediss://…) — cache + event bus
      - { key: CLOUDINARY_URL, sync: false } # cloudinary://key:secret@cloud
      - { key: OTEL_EXPORTER_OTLP_ENDPOINT, sync: false } # https://otlp-gateway-<region>.grafana.net/otlp
      - { key: OTEL_EXPORTER_OTLP_HEADERS, sync: false } # Authorization=Basic <base64 id:token>
      # ── Feature integrations (all OPTIONAL — unset ⇒ safe dev fallback; verify with scripts/) ──
      # Mail (auth magic-link/welcome + notification digests). Brevo/Postfix: smtp://user:pass@host:587
      - { key: SMTP_URL, sync: false } # URL-encode @/: in user+pass (@ → %40)
      - { key: MAIL_FROM, sync: false } # a VERIFIED sender (else the relay blocks it)
      - { key: MAIL_LOGO_URL, sync: false } # public logo URL for emails (optional)
      - { key: MAIL_WEBSITE_URL, value: https://velcart.netlify.app/ } # footer website icon
      - { key: MAIL_LINKEDIN_URL, value: https://www.linkedin.com/company/velcart/ } # footer LinkedIn
      - { key: MAIL_SUPPORT_TEXT, value: support@velcart.com } # footer support text → website
      # Reverse-OTP (₹0 verification, §B2.2) — Asterisk/FreeSWITCH webhook
      - { key: REVOTP_WEBHOOK_SECRET, sync: false }
      - { key: REVOTP_DID, sync: false } # owned inbound number users missed-call / SMS
      # 2Factor.in SMS OTP (§B2) — the PRIMARY phone verification for the mobile app.
      # Without these the auth-service stays in fail-closed dev-mode and returns 403
      # ("only the configured dev phone may receive an OTP") for every number.
      - { key: OTP_API_KEY, sync: false } # 2Factor.in API key
      - { key: OTP_TEMPLATE, sync: false } # DLT-approved template name (default: Temp1)
      # SAFETY fuse (code default = "true"): while true, ONLY OTP_DEV_PHONE receives an OTP.
      # Dashboard-controlled (sync:false) so the blueprint never OVERWRITES your choice on a
      # redeploy — set "false" to let any number verify (prod), or keep true + set OTP_DEV_PHONE.
      - { key: OTP_DEV_MODE, sync: false }
      - { key: OTP_DEV_PHONE, sync: false } # the one E.164 number allowed while dev-mode is on
      # Fixed code the dev phone verifies against while dev-mode is on (code default = "123456").
      # With OTP_DEV_MODE=true + OTP_DEV_PHONE set, that number gets an instant OTP with NO real
      # SMS and NO send rate-limits — enter OTP_DEV_CODE to verify. Fully off when OTP_DEV_MODE=false.
      - { key: OTP_DEV_CODE, sync: false }
      # Web Push (VAPID) — npx web-push generate-vapid-keys
      - { key: VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false } # mailto:ops@yourdomain or a URL
      # Mobile Push (FCM HTTP v1) — from the service-account JSON (keep \n escapes in the key)
      - { key: FCM_PROJECT_ID, sync: false }
      - { key: FCM_CLIENT_EMAIL, sync: false }
      - { key: FCM_PRIVATE_KEY, sync: false }
      # Calls (LiveKit SFU) — from your LiveKit server/cloud
      - { key: LIVEKIT_URL, sync: false } # wss://…
      - { key: LIVEKIT_API_KEY, sync: false }
      - { key: LIVEKIT_API_SECRET, sync: false }

services:
  - type: web
    name: velchat-edge-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./docker/edge-gateway.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        [
          apps/edge-gateway/**,
          libs/**,
          docker/edge-gateway.Dockerfile,
          package.json,
          pnpm-lock.yaml,
          render.yaml,
        ]
    envVars:
      - { fromGroup: velchat-shared }
      - { key: SERVICE_NAME, value: edge-gateway }
      # Routing targets for the six-service topology. SPLIT_PROFILE=axis6 maps each logical
      # service (AUTH, CHAT, PRESENCE, …) onto whichever of these owns it — see
      # apps/edge-gateway/src/gateway/topology.ts.
      - { key: SPLIT_PROFILE, value: axis6 }
      - { key: UPSTREAM_IDENTITY, value: https://velchat-identity-service.onrender.com }
      - { key: UPSTREAM_MESSAGING, value: https://velchat-messaging-service.onrender.com }
      - { key: UPSTREAM_REALTIME, value: https://velchat-realtime-service.onrender.com }
      - { key: UPSTREAM_CONTENT, value: https://velchat-content-service.onrender.com }
      - { key: UPSTREAM_PLATFORM, value: https://velchat-platform-service.onrender.com }

  - type: web
    name: velchat-identity-service
    runtime: docker
    plan: free
    dockerfilePath: ./docker/identity-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        [
          apps/identity-service/**,
          libs/**,
          docker/identity-service.Dockerfile,
          package.json,
          pnpm-lock.yaml,
        ]
    envVars:
      - { fromGroup: velchat-shared }
      - { key: SERVICE_NAME, value: identity-service }

  - type: web
    name: velchat-messaging-service
    runtime: docker
    plan: free
    dockerfilePath: ./docker/messaging-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        [
          apps/messaging-service/**,
          libs/**,
          docker/messaging-service.Dockerfile,
          package.json,
          pnpm-lock.yaml,
        ]
    envVars:
      - { fromGroup: velchat-shared }
      - { key: SERVICE_NAME, value: messaging-service }

  - type: web
    name: velchat-realtime-service
    runtime: docker
    plan: free
    dockerfilePath: ./docker/realtime-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        [
          apps/realtime-service/**,
          libs/**,
          docker/realtime-service.Dockerfile,
          package.json,
          pnpm-lock.yaml,
        ]
    envVars:
      - { fromGroup: velchat-shared }
      - { key: SERVICE_NAME, value: realtime-service }
      # The WebSocket fabric resolves conversation membership from the service that owns it.
      - { key: UPSTREAM_IDENTITY, value: https://velchat-identity-service.onrender.com }

  - type: web
    name: velchat-content-service
    runtime: docker
    plan: free
    dockerfilePath: ./docker/content-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        [
          apps/content-service/**,
          libs/**,
          docker/content-service.Dockerfile,
          package.json,
          pnpm-lock.yaml,
        ]
    envVars:
      - { fromGroup: velchat-shared }
      - { key: SERVICE_NAME, value: content-service }

  - type: web
    name: velchat-platform-service
    runtime: docker
    plan: free
    dockerfilePath: ./docker/platform-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        [
          apps/platform-service/**,
          libs/**,
          docker/platform-service.Dockerfile,
          package.json,
          pnpm-lock.yaml,
        ]
    envVars:
      - { fromGroup: velchat-shared }
      - { key: SERVICE_NAME, value: platform-service }
